[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavebird-publisher-server"
version = "0.1.0b5"
description = "Framework-neutral Wavebird publisher integration for Banner, Native, and Clip"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wavebird_publisher = ["browser.js"]
